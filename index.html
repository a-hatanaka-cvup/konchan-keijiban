<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コンちゃん掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================
     ヘッダー
============================================ -->
<header class="hero">
    <div class="hero-deco hero-deco--circle-yellow"></div>
    <div class="hero-deco hero-deco--circle-blue"></div>
    <div class="hero-deco hero-deco--star"></div>

    <div class="hero-inner">
        <p class="hero-eyebrow">MOMO STA COMMUNITY BOARD</p>
        <h1 class="hero-title">コンちゃん掲示板</h1>
        <p class="hero-sub">みんなの「言いたい」を、ぽーんと投稿しよう！</p>
    </div>

    <img class="hero-character" src="img/fox_05.png" alt="ジャンプして喜ぶきつねのキャラクター">

    <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,64 C240,120 480,0 720,32 C960,64 1200,120 1440,64 L1440,120 L0,120 Z" fill="#FFFBF2"></path>
    </svg>
</header>

<main class="page">

    <!-- ============================================
         ログイン / 新規登録バー
    ============================================ -->
    <section class="auth-card" id="auth-card">

        <!-- ログイン中はこちらを表示 -->
        <div class="auth-loggedin" id="auth-loggedin" hidden>
            <img class="auth-avatar" id="auth-avatar" src="img/fox_01.png" alt="自分のアイコン">
            <p class="auth-greeting" id="auth-greeting">ようこそ！</p>
            <a class="auth-link" href="mypage.html">マイページ</a>
            <button type="button" class="auth-link auth-link--button" id="logout-btn">ログアウト</button>
        </div>

        <!-- 未ログイン時はこちらを表示 -->
        <div class="auth-loggedout" id="auth-loggedout">
            <div class="auth-tabs">
                <button type="button" class="auth-tab is-active" id="tab-login" data-mode="login">ログイン</button>
                <button type="button" class="auth-tab" id="tab-signup" data-mode="signup">新規登録</button>
            </div>

            <form id="auth-form">
                <div class="form-row">
                    <label for="auth-email">メールアドレス</label>
                    <input type="email" id="auth-email" required>
                </div>
                <div class="form-row">
                    <label for="auth-password">パスワード</label>
                    <input type="password" id="auth-password" minlength="6" required>
                </div>
                <div class="form-row" id="auth-password-confirm-row" hidden>
                    <label for="auth-password-confirm">パスワード（確認）</label>
                    <input type="password" id="auth-password-confirm" minlength="6">
                </div>

                <p class="form-error" id="auth-error" hidden></p>
                <p class="form-note" id="auth-note" hidden></p>

                <button type="submit" class="btn-submit" id="auth-submit-btn">ログイン</button>
            </form>

            <div class="auth-divider"><span>または</span></div>

            <button type="button" class="btn-google" id="google-login-btn">Googleでログイン</button>
        </div>
    </section>

    <!-- ============================================
         掲示板についての一言案内
    ============================================ -->
    <section class="intro-card">
        <img class="intro-character" src="img/fox_02.png" alt="説明するきつねのキャラクター">
        <div class="speech-bubble">
            <p>ここは<strong>ライティングパーク</strong>のみんなが自由に投稿できる掲示板だよ！<br>
            名前とコメントを入れて、気軽に投稿してね🍊</p>
        </div>
    </section>

    <!-- ============================================
         投稿フォーム（デザイン確認用・見た目のみ）
    ============================================ -->
    <section class="post-form-card">
        <div class="section-heading">
            <img class="section-icon" src="img/fox_07.png" alt="指を上に向けるきつねのキャラクター">
            <h2>きみの声を聞かせて！</h2>
        </div>

        <form class="post-form" id="post-form" hidden>
            <div class="form-row">
                <label for="message">コメント</label>
                <textarea id="message" rows="4" placeholder="投稿したい内容を書いてね" maxlength="500"></textarea>
            </div>

            <p class="form-error" id="form-error" hidden></p>

            <button type="submit" class="btn-submit" id="submit-btn">投稿する！</button>
        </form>

        <p class="post-form-locked" id="post-form-locked">投稿するには、上の欄からログインしてください。</p>
    </section>

    <!-- ============================================
         投稿一覧（Supabaseから取得して表示）
    ============================================ -->
    <section class="post-list-area">
        <div class="section-heading">
            <img class="section-icon" src="img/fox_01.png" alt="笑顔のきつねのキャラクター">
            <h2>みんなの投稿</h2>
        </div>

        <p class="post-list-status" id="post-list-status">読み込み中…</p>
        <ul class="post-list" id="post-list"></ul>
    </section>

</main>

<footer class="site-footer">
    <img class="footer-character" src="img/fox_03.png" alt="きつねのキャラクター">
    <p>&copy; 2026 ライティングパーク</p>
    <p class="footer-links">
        <a href="privacy.html">プライバシーポリシー</a>
        <span aria-hidden="true">・</span>
        <a href="terms.html">利用規約</a>
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
